<!doctype html>
<!--
  Source of public/chere/join-og.jpg, the share card for /chere/join (S384, 2026-11-21).
  Inputs, beside this file when rendering:
    ba.jpg     public/work/chere-poster-1280.webp cropped to its top 1280x572 (the before and after, no caption)
    icon.png   wf-seabreeze app/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
    node_modules/@fontsource-variable/fraunces, @fontsource/ibm-plex-sans, @fontsource/jetbrains-mono (the site's own fonts)
  Render: google-chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630
          --virtual-time-budget=3000 --allow-file-access-from-files --screenshot=card.png file://$PWD/chere-join.html
  Then JPEG quality 92, 4:4:4, progressive (147 KB). A lossless PNG is 810 KB, over what chat apps fetch.
  Colors are the app icon's own: #016d90 to #062c3b, cream #f0ece2, mint #00b096.
-->

<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Fraunces'; src: url('node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Plex'; src: url('node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Plex'; src: url('node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'Plex'; src: url('node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'Mono'; src: url('node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  background:
    radial-gradient(900px 520px at 88% 18%, rgba(0,176,150,0.20), transparent 62%),
    radial-gradient(700px 500px at 0% 100%, rgba(0,116,154,0.35), transparent 60%),
    linear-gradient(150deg, #016d90 0%, #05445b 48%, #062c3b 100%);
  color: #f0ece2;
  font-family: 'Plex', sans-serif;
}
/* fine grain so the gradient does not band in chat apps that recompress */
.grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
.left { position: absolute; left: 72px; top: 64px; width: 560px; }
.brand { display: flex; align-items: center; gap: 18px; }
.icon { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(240,236,226,.14); }
.eyebrow { font-family: 'Mono', monospace; font-size: 15px; letter-spacing: 3.2px; color: #4fe0c6; text-transform: uppercase; line-height: 1.55; }
.eyebrow b { color: #f0ece2; font-weight: 500; }
h1 { margin-top: 40px; font-family: 'Fraunces', serif; font-weight: 640; font-variation-settings: 'opsz' 144, 'SOFT' 50; font-size: 78px; line-height: 0.98; letter-spacing: -1.6px; }
h1 .apos { color: #00c4a7; }
.sub { margin-top: 24px; font-size: 25px; line-height: 1.38; color: rgba(240,236,226,.86); max-width: 440px; }
.chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 12px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px;
  background: rgba(6,44,59,.55); border: 1px solid rgba(240,236,226,.22); font-size: 18px; font-weight: 500; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: #00c4a7; box-shadow: 0 0 12px rgba(0,196,167,.9); }
.chip .via { color: rgba(240,236,226,.62); font-weight: 400; }
/* the photo: the demo video's own frame, tilted, with the app icon pinned to its corner */
.photo { position: absolute; right: 44px; top: 112px; width: 584px; height: 261px; border-radius: 18px; overflow: hidden;
  transform: rotate(-4deg); box-shadow: 0 40px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(240,236,226,.18); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pin { position: absolute; right: 512px; top: 340px; width: 118px; height: 118px; border-radius: 28px; transform: rotate(-4deg);
  box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 0 0 4px rgba(240,236,226,.95); }
.url { position: absolute; right: 64px; bottom: 70px; font-family: 'Mono', monospace; font-size: 19px; letter-spacing: .6px; color: #f0ece2; text-align: right; }
.url .by { display: block; margin-bottom: 8px; font-size: 13px; letter-spacing: 3px; color: rgba(240,236,226,.6); text-transform: uppercase; }
</style></head>
<body>
  <div class="grain"></div>
  <div class="photo"><img src="ba.jpg" alt=""></div>
  <img class="pin" src="icon.png" alt="">
  <div class="left">
    <div class="brand">
      <div class="eyebrow">Chere' beta<br><b>iPhone · iPad · Android</b></div>
    </div>
    <h1>Get Chere<span class="apos">'</span><br>on your phone.</h1>
    <p class="sub">Install in a few taps, text Preston your key, and you're in.</p>
  </div>
  <div class="chips">
    <div class="chip"><span class="dot"></span>iPhone &amp; iPad <span class="via">TestFlight</span></div>
    <div class="chip"><span class="dot"></span>Android <span class="via">Google Play</span></div>
  </div>
  <div class="url"><span class="by">Winters Code · Bandon, Oregon</span>winterscode.com/chere/join</div>
</body></html>
