<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Winters Code seal">
  <title>Winters Code · Seal</title>
  <desc>Sixth generation Bandon, Oregon. Founded MMXXVI.</desc>

  <defs>
    <!-- Curved path for outer ring text -->
    <path id="ringTop" d="M 100,100 m -78,0 a 78,78 0 1,1 156,0" fill="none" />
    <path id="ringBottom" d="M 100,100 m -72,0 a 72,72 0 1,0 144,0" fill="none" />
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9" />
  <!-- Hairline inside outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.5" />
  <!-- Inner medallion ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55" />

  <!-- Outer ring TOP text -->
  <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" letter-spacing="3.2" fill="currentColor" opacity="0.9" font-weight="500">
    <textPath href="#ringTop" startOffset="50%" text-anchor="middle">
      · WINTERS CODE · BANDON ·
    </textPath>
  </text>

  <!-- Outer ring BOTTOM text: EST · MMXXVI · OREGON -->
  <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="3.5" fill="currentColor" opacity="0.75" font-weight="500">
    <textPath href="#ringBottom" startOffset="50%" text-anchor="middle">
      EST · MMXXVI · OREGON
    </textPath>
  </text>

  <!-- Decorative side dots flanking the medallion -->
  <circle cx="22" cy="100" r="2" fill="currentColor" opacity="0.7" />
  <circle cx="178" cy="100" r="2" fill="currentColor" opacity="0.7" />

  <!-- Central Fraunces italic W -->
  <!-- Using SVG text with serif italic. Falls back gracefully if Fraunces not loaded. -->
  <text x="100" y="125"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-size="86"
        font-weight="600"
        font-style="italic"
        text-anchor="middle"
        fill="currentColor"
        letter-spacing="-0.02em">W</text>

  <!-- Tiny rule under the W for letterpress feel -->
  <line x1="78" y1="138" x2="122" y2="138" stroke="currentColor" stroke-width="0.75" opacity="0.55" />

  <!-- Two small tick marks just below the rule -->
  <line x1="98" y1="142" x2="98" y2="146" stroke="currentColor" stroke-width="0.6" opacity="0.45" />
  <line x1="102" y1="142" x2="102" y2="146" stroke="currentColor" stroke-width="0.6" opacity="0.45" />
</svg>
