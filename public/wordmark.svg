<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="Winters Code wordmark">
  <title>Winters Code</title>
  <desc>Winters Code wordmark, Bandon Oregon, established 2026.</desc>

  <!-- Left margin tick -->
  <line x1="0" y1="20" x2="0" y2="100" stroke="currentColor" stroke-width="1" opacity="0.4" />

  <!-- Primary wordmark, Fraunces serif -->
  <text x="14" y="62"
        font-family="'Fraunces', Georgia, serif"
        font-size="54"
        font-weight="600"
        fill="currentColor"
        letter-spacing="-0.015em">Winters Code</text>

  <!-- Hairline rule under wordmark, with gradient fade at ends in copper contexts -->
  <line x1="14" y1="78" x2="466" y2="78" stroke="currentColor" stroke-width="1" opacity="0.45" />

  <!-- Small tick at rule mid -->
  <line x1="240" y1="76" x2="240" y2="82" stroke="currentColor" stroke-width="0.75" opacity="0.6" />

  <!-- Mono kicker line -->
  <text x="14" y="100"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="11"
        letter-spacing="3.2"
        fill="currentColor"
        opacity="0.85"
        font-weight="500">EST. MMXXVI · 6TH GEN BANDON · OREGON</text>
</svg>
