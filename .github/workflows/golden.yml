# Build-output golden check on pull requests (T-347, S436).
#
# Nothing ran golden.py verify on a PR, so a content change could merge with the .goldens manifest
# stale (#44 did). This builds the PR and fails on any non-volatile byte change against the committed
# .goldens/manifest.tsv. An intended change recaptures the manifest in the same PR:
#   python3 scripts/golden/golden.py capture . --update
# and puts back the changelog.html and wall.html rows (declared volatile, they move on every capture).
name: golden

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".goldens/**"
      - "scripts/**"
      - ".github/workflows/golden.yml"

permissions:
  contents: read

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history: astro.config.mjs derives sitemap lastmod from git log, and the changelog page is built from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4" # the version the baseline was captured on; engines asks for >=22.12.0

      - name: Check the vendored golden.py against its pinned sha256
        run: |
          python3 - <<'PY'
          import hashlib, re, sys
          lines = open("scripts/golden/golden.py", encoding="utf-8").read().split("\n")
          end = next(i for i, l in enumerate(lines) if l.strip() == "# END VENDOR HEADER")
          pinned = next(re.search(r"[0-9a-f]{64}", l).group(0) for l in lines[:end] if l.startswith("# source sha256:"))
          body = "\n".join([lines[0]] + lines[end + 1:]).encode("utf-8")
          got = hashlib.sha256(body).hexdigest()
          print("pinned  ", pinned)
          print("computed", got)
          sys.exit(0 if got == pinned else 1)
          PY

      - name: Install
        run: npm ci
        env:
          NODE_ENV: development # install devDependencies too; the build script allowlists its own environment

      - name: Build and verify against .goldens/manifest.tsv
        run: python3 scripts/golden/golden.py verify .

      - name: Whole diff list, when the golden moved
        if: failure()
        run: cat .goldens/last-diff.tsv 2>/dev/null || true
